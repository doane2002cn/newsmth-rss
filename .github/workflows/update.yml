name: 更新水木 RSS

on:
  schedule:
    # 每 3 小时一次（0/3/6/9/12/15/18/21 点第 5 分）。
    # 不设每小时：GitHub 对高频定时任务会大量丢弃，实测每小时只跑成 3–5 小时一次，
    # 与其名义上每小时、实际不准，不如明确 3 小时一轮。
    # 12 点这一轮有意保留，供 12:10 的每日推荐取当轮数据。
    - cron: '5 */3 * * *'
  # 改源清单/脚本时立即重跑一次；机器人自身的提交只碰 docs/ 和 data/，不会自触发
  push:
    paths:
      - 'sources.json'
      - 'scripts/**'
      - '.github/workflows/update.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

concurrency:
  group: newsmth-rss
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python 环境
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 抓取并生成 RSS
        run: python scripts/fetch_feeds.py

      - name: 提交并推送更新
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs data
          if git diff --staged --quiet; then
            echo "内容没有变化，跳过提交"
          else
            git commit -m "自动更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi
