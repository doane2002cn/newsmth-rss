name: 更新水木 RSS

on:
  schedule:
    # 每小时第 25 分钟运行，避开整点调度高峰
    - cron: '25 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

concurrency:
  group: newsmth-rss
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python 环境
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 抓取并生成 RSS
        run: python scripts/fetch_feeds.py

      - name: 提交并推送更新
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs data
          if git diff --staged --quiet; then
            echo "内容没有变化，跳过提交"
          else
            git commit -m "自动更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi
